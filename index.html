<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Template Batch Filler</title>
  <style>
    body{font-family:Inter,Arial,sans-serif;max-width:1000px;margin:24px auto;padding:0 16px;color:#111}
    textarea,input{width:100%;box-sizing:border-box;padding:10px;border:1px solid #ddd;border-radius:8px}
    textarea{min-height:120px} .row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    button{padding:10px 14px;border:0;background:#111;color:#fff;border-radius:8px;cursor:pointer}
    .card{border:1px solid #eee;border-radius:12px;padding:14px;margin:10px 0}
    pre{white-space:pre-wrap;background:#f8f8f8;padding:10px;border-radius:8px}
    small{color:#666}
  </style>
</head>
<body>
  <h1>Template Batch Filler</h1>
  <p>把一份模板批量套入多组数据。适合生成文案、邮件、PRD片段、社媒草稿。</p>
  <div class="row">
    <div>
      <h3>1) 模板（使用 {{name}} 占位）</h3>
      <textarea id="tpl">你好 {{name}}，\n这是为 {{product}} 准备的 {{type}} 草稿。\n截止时间：{{deadline}}。</textarea>
    </div>
    <div>
      <h3>2) JSON 数组数据</h3>
      <textarea id="data">[
  {"name":"小李","product":"AI 周报","type":"首发文案","deadline":"周三"},
  {"name":"Mia","product":"SaaS Landing Page","type":"邮件跟进","deadline":"Friday"}
]</textarea>
    </div>
  </div>
  <p><button id="run">生成批量结果</button> <button id="dl">下载 results.txt</button></p>
  <small>提示：仅本地浏览器运行，不上传数据。</small>
  <div id="out"></div>
<script>
const out = document.getElementById('out');
let joined='';
function fill(tpl,obj){return tpl.replace(/\{\{\s*(\w+)\s*\}\}/g,(_,k)=>obj[k]??'');}
document.getElementById('run').onclick=()=>{
  out.innerHTML=''; joined='';
  try{
    const tpl=document.getElementById('tpl').value;
    const arr=JSON.parse(document.getElementById('data').value);
    if(!Array.isArray(arr)) throw new Error('数据必须是 JSON 数组');
    const blocks=arr.map((it,i)=>`#${i+1}\n${fill(tpl,it)}`);
    joined=blocks.join('\n\n----\n\n');
    blocks.forEach((b,i)=>{
      const d=document.createElement('div'); d.className='card';
      d.innerHTML=`<strong>结果 ${i+1}</strong><pre>${b.replace(/</g,'&lt;')}</pre>`;
      out.appendChild(d);
    });
  }catch(e){ out.innerHTML=`<div class="card" style="border-color:#f66">错误：${e.message}</div>`; }
}
document.getElementById('dl').onclick=()=>{
  if(!joined){alert('请先生成结果');return}
  const blob=new Blob([joined],{type:'text/plain;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='results.txt'; a.click();
}
</script>
</body>
</html>
